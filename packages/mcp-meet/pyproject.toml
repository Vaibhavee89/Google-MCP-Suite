[project]
name = "google-mcp-meet"
version = "0.1.0"
description = "Google Meet MCP server (Admin Reports-based)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "google", "meet", "reports"]
dependencies = [
  "google-mcp-core",
  "google-api-python-client>=2.100.0",
]

[project.scripts]
google-meet-mcp = "google_meet_mcp.server:run"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"google_meet_mcp" = ["py.typed"]

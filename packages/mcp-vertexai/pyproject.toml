[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[project]
name = "google-vertexai-mcp"
version = "0.1.0"
dependencies = [
  "google-mcp-core>=0.1.0",
  "google-cloud-aiplatform>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]

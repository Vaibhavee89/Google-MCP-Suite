[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-forms-mcp"
version = "0.1.0"
dependencies = [
  "google-mcp-core>=0.1.0",
]

[project.scripts]
google-forms-mcp = "google_forms_mcp.server:run"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]
